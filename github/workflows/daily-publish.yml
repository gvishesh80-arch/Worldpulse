name: Daily Blog Publisher

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate blog
        env:
          WORLDPULSEBLOG: ${{ secrets.WORLDPULSEBLOG }}
        run: python publish-1.py

      - name: Commit and push
        run: |
          git config user.name "WorldPulse Bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html .nojekyll
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Publish $(date -u +%F)"
            git push
          fi
